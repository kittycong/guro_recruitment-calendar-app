<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6e2432" />
    <link rel="manifest" href="./manifest.json" />
    <title>채용 달력 관리 v2.0</title>
    <link rel="stylesheet" href="./styles.css?v=20260609-integrated" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="채용 일정 입력">
        <div class="brand">
          <div>
            <h1>채용 달력 관리</h1>
            <p>Step-by-step으로 공고를 등록하고 달력에서 관리</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-heading">
            <h2>채용 공고 등록</h2>
            <button class="icon-button" id="resetFormButton" type="button" aria-label="입력 초기화" title="입력 초기화">↺</button>
          </div>

          <!-- Step Progress Bar -->
          <div class="step-progress">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="step-label">
              <span id="stepNumber">1</span> / 4 단계
            </div>
          </div>

          <!-- Step Tabs -->
          <div class="step-tabs">
            <button class="step-tab active" data-step="1">1. 기본정보</button>
            <button class="step-tab" data-step="2">2. 공고정보</button>
            <button class="step-tab" data-step="3">3. 일정관리</button>
            <button class="step-tab" data-step="4">4. 검토</button>
          </div>

          <form id="candidateForm" class="candidate-form">
            <input type="hidden" id="candidateId" />

            <!-- Step 1: 기본정보 -->
            <div class="form-step active" data-step="1">
              <div class="step-title">기본정보</div>
              
              <label>
                채용건명
                <input id="nameInput" type="text" required placeholder="예: 생활지원팀 사회복지사 채용" />
              </label>

              <div class="date-grid">
                <label>
                  부서
                  <select id="departmentInput" required>
                    <option>사무행정팀</option>
                    <option>활동지원팀</option>
                    <option>복지사업팀</option>
                    <option>복지사업팀(주택)</option>
                  </select>
                </label>
                <label>
                  채용명수
                  <input id="hireCountInput" type="number" min="1" max="99" value="1" />
                </label>
              </div>

              <label>
                시행번호
                <div class="execution-input">
                  <span>GR2026-A-</span>
                  <input id="executionNoInput" type="text" inputmode="numeric" maxlength="3" placeholder="042" />
                </div>
              </label>
            </div>

            <!-- Step 2: 공고정보 -->
            <div class="form-step" data-step="2">
              <div class="step-title">공고정보</div>

              <label>
                지원경로
                <select id="sourceInput">
                  <option>워크넷</option>
                  <option>사람인</option>
                  <option>잡코리아</option>
                  <option>추천</option>
                  <option>홈페이지</option>
                  <option>기타</option>
                </select>
              </label>

              <div class="date-grid">
                <label>
                  공고유형
                  <select id="noticeTypeInput">
                    <option value="urgent">긴급 공고</option>
                    <option value="normal">일반 공고</option>
                  </select>
                </label>
                <label>
                  공고일
                  <input id="noticeDateInput" type="date" />
                </label>
              </div>

              <label>
                채용유형
                <select id="employmentTypeInput">
                  <option>정규직</option>
                  <option>계약직</option>
                  <option>기간제</option>
                  <option>기타</option>
                </select>
              </label>

              <label>
                메모
                <textarea id="memoInput" rows="3" placeholder="특이사항, 준비서류, 면접 메모"></textarea>
              </label>
            </div>

            <!-- Step 3: 일정관리 -->
            <div class="form-step" data-step="3">
              <div class="step-title">일정관리</div>

              <div class="date-grid">
                <label>
                  면접 확정일
                  <input id="confirmedInterviewDateInput" type="date" />
                </label>
                <label>
                  근무개시일
                  <input id="workStartDateInput" type="date" />
                </label>
              </div>

              <div class="date-grid">
                <label>
                  채용일자
                  <input id="hireDateInput" type="date" />
                </label>
                <label>
                  수습개월
                  <input id="probationMonthsInput" type="number" min="0" max="24" value="3" />
                </label>
              </div>

              <label>
                최종상태
                <select id="statusInput">
                  <option>진행중</option>
                  <option>채용</option>
                  <option>불합격</option>
                  <option>포기</option>
                  <option>보류</option>
                </select>
              </label>

              <section class="form-section">
                <div class="section-title-row">
                  <div>
                    <strong>면접 대상자</strong>
                    <span>이름, 연락처, 진행 상태를 개별로 관리</span>
                  </div>
                  <button class="small-button" id="addIntervieweeButton" type="button">추가</button>
                </div>
                <div id="intervieweeRows" class="interviewee-editor" aria-label="면접 대상자 목록"></div>
                <textarea id="intervieweesInput" rows="4" hidden></textarea>
              </section>
            </div>

            <!-- Step 4: 검토 및 저장 -->
            <div class="form-step" data-step="4">
              <div class="step-title">검토 및 저장</div>

              <div class="review-section">
                <h3>✓ 기본정보</h3>
                <dl class="review-list">
                  <dt>채용 건명</dt>
                  <dd id="review-name">-</dd>
                  <dt>부서</dt>
                  <dd id="review-department">-</dd>
                  <dt>채용 명수</dt>
                  <dd id="review-count">-</dd>
                  <dt>시행번호</dt>
                  <dd id="review-serial">-</dd>
                </dl>
              </div>

              <div class="review-section">
                <h3>✓ 공고정보</h3>
                <dl class="review-list">
                  <dt>지원경로</dt>
                  <dd id="review-source">-</dd>
                  <dt>공고유형</dt>
                  <dd id="review-type">-</dd>
                  <dt>공고일</dt>
                  <dd id="review-notice-date">-</dd>
                  <dt>채용유형</dt>
                  <dd id="review-employment">-</dd>
                </dl>
              </div>

              <div class="review-section">
                <h3>✓ 일정</h3>
                <dl class="review-list">
                  <dt>면접일</dt>
                  <dd id="review-interview">-</dd>
                  <dt>근무 개시일</dt>
                  <dd id="review-start">-</dd>
                  <dt>채용일</dt>
                  <dd id="review-hire">-</dd>
                  <dt>수습 개월</dt>
                  <dd id="review-probation">-</dd>
                </dl>
              </div>
            </div>

            <!-- Schedule Preview (기존 유지) -->
            <section class="schedule-preview" aria-label="자동 생성 일정">
              <div class="schedule-preview-title">자동 생성 일정</div>
              <dl id="schedulePreview"></dl>
            </section>

            <!-- Step Navigation -->
            <div class="step-actions">
              <button type="button" id="prevButton" class="secondary-button" style="display: none;">← 이전</button>
              <button type="button" id="nextButton" class="primary-button">다음 →</button>
              <button type="submit" id="submitButton" class="primary-button" style="display: none;">저장</button>
            </div>

            <!-- 기존 버튼들 (숨김) -->
            <div class="form-actions" style="display: none;">
              <button class="primary-button" type="submit">저장</button>
              <button class="secondary-button" id="deleteButton" type="button" disabled>삭제</button>
            </div>
          </form>
        </section>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div class="month-controls">
            <button class="icon-button" id="prevMonthButton" type="button" aria-label="이전 달" title="이전 달">‹</button>
            <div>
              <p class="eyebrow">Calendar</p>
              <h2 id="monthTitle"></h2>
            </div>
            <button class="icon-button" id="nextMonthButton" type="button" aria-label="다음 달" title="다음 달">›</button>
            <button class="today-button" id="todayButton" type="button">오늘</button>
          </div>
          <div class="toolbar-actions">
            <label class="search-box">
              <span>검색</span>
              <input id="searchInput" type="search" placeholder="이름, 직무, 연락처" />
            </label>
            <button class="secondary-button" id="googleCalendarConnectButton" type="button">Google 연결</button>
            <label class="calendar-id-box">
              <span>캘린더ID</span>
              <input id="googleCalendarIdInput" type="text" placeholder="primary 또는 공유 캘린더 ID" />
            </label>
            <span class="calendar-sync-status" id="googleCalendarStatus">Google 미연결</span>
            <button class="secondary-button" id="exportButton" type="button">CSV 내보내기</button>
          </div>
        </header>

        <section class="summary-strip" aria-label="채용 요약">
          <div class="metric">
            <span>전체</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="metric">
            <span>면접 예정</span>
            <strong id="activeCount">0</strong>
          </div>
          <div class="metric">
            <span>채용</span>
            <strong id="hiredCount">0</strong>
          </div>
          <div class="metric">
            <span>수습중</span>
            <strong id="probationCount">0</strong>
          </div>
          <div class="metric urgent">
            <span>종료임박</span>
            <strong id="soonCount">0</strong>
          </div>
        </section>

        <section class="deadline-banner" id="deadlineBanner" aria-label="마감 알림"></section>

        <nav class="view-tabs" aria-label="화면 전환">
          <button type="button" class="view-tab active" data-view="calendar">달력</button>
          <button type="button" class="view-tab" data-view="interviews">면접관리</button>
          <button type="button" class="view-tab" data-view="kanban">칸반</button>
          <button type="button" class="view-tab" data-view="timeline">타임라인</button>
          <button type="button" class="view-tab" data-view="list">리스트</button>
          <button type="button" class="view-tab" data-view="documents">문서생성</button>
          <button type="button" class="view-tab" data-view="hires">채용</button>
          <button type="button" class="view-tab" data-view="probation">수습</button>
        </nav>

        <div id="viewContainer" class="view-container">
          <!-- 달력 뷰 -->
          <div id="calendarView" class="view active">
            <div id="calendar" class="calendar"></div>
          </div>

          <!-- 면접자 관리 뷰 -->
          <div id="interviewsView" class="view" style="display: none;">
            <table id="intervieweeTable" class="data-table"></table>
          </div>

          <!-- 칸반 보드 뷰 -->
          <div id="kanbanView" class="view" style="display: none;">
            <div id="kanban" class="kanban-board"></div>
          </div>

          <!-- 타임라인 뷰 -->
          <div id="timelineView" class="view" style="display: none;">
            <div id="timeline" class="timeline-container"></div>
          </div>

          <!-- 리스트 뷰 -->
          <div id="listView" class="view" style="display: none;">
            <table id="candidateList" class="data-table"></table>
          </div>

          <!-- 문서 생성 뷰 -->
          <div id="documentsView" class="view" style="display: none;">
            <div id="documentsContainer" class="documents-container"></div>
          </div>

          <!-- 채용 뷰 -->
          <div id="hiresView" class="view" style="display: none;">
            <table id="hiresList" class="data-table"></table>
          </div>

          <!-- 수습 뷰 -->
          <div id="probationView" class="view" style="display: none;">
            <table id="probationList" class="data-table"></table>
          </div>
        </div>
      </main>
    </div>

    <script src="./jszip.min.js"></script>
    <script src="./template-data.js"></script>
    <script src="./app.js?v=20260609-integrated"></script>
  </body>
</html>
